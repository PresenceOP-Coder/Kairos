name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      run: go test ./... -race -cover

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
